{% extends "admin/base.html" %}
{% block content %}

<div class="max-w-3xl mx-auto">

  <div class="bg-white rounded-xl shadow-sm border p-6 sm:p-8">

    <h2 class="text-xl font-bold text-gray-800 mb-1">
      {% if departamento %}Editar Departamento{% else %}Novo Departamento{% endif %}
    </h2>
    <p class="text-sm text-gray-500 mb-6">
      Preencha corretamente os dados do departamento
    </p>

    <form method="post" class="space-y-5">
      {% csrf_token %}

      <div>
        <label class="block text-sm font-semibold text-gray-700 mb-1">
          Nome do Departamento
        </label>
        <input type="text" name="nome"
               value="{{ departamento.nome|default:'' }}"
               required
               class="w-full px-4 py-2 rounded-lg border focus:ring-2 focus:ring-primary focus:outline-none">
      </div>

      <div>
        <label class="block text-sm font-semibold text-gray-700 mb-1">
          Descrição
        </label>
        <textarea name="descricao" rows="4"
                  class="w-full px-4 py-2 rounded-lg border focus:ring-2 focus:ring-primary focus:outline-none">{{ departamento.descricao|default:'' }}</textarea>
      </div>

      <div class="flex flex-col sm:flex-row gap-3 pt-4">
        <button type="submit"
                class="flex-1 bg-primary text-white py-2 rounded-lg font-bold hover:bg-primary/90 transition">
          Salvar
        </button>

        <a href="{% url 'lista_departamentos' %}"
           class="flex-1 text-center py-2 rounded-lg font-bold bg-gray-100 hover:bg-gray-200">
          Cancelar
        </a>
      </div>

    </form>

  </div>

</div>

{% endblock %}
