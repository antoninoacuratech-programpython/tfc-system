{% extends "layouts/autenticacao.html" %}

{% block titulo %}Entrar{% endblock %}

{% block conteudo %}
  <h1 class="sgtf-auth__title">Bem-vindo!</h1>

  <div class="mt-5">{% include "partials/_mensagens.html" %}</div>

  <form method="post" class="mt-5 space-y-3.5" autocomplete="on" data-lock>
    {% csrf_token %}
    <input type="hidden" name="next" value="{{ next }}">

    <div class="sgtf-auth-field">
      <label for="email" class="sr-only">E-mail</label>
      <input id="email" name="username" type="email" required autocomplete="username" inputmode="email"
             value="{{ request.POST.username|default:'' }}" placeholder="Introduza o seu e-mail" class="sgtf-auth-input">
      <span class="sgtf-auth-icon"><span class="material-icons-sharp">mail_outline</span></span>
    </div>

    <div class="sgtf-auth-field">
      <label for="senha" class="sr-only">Senha</label>
      <input id="senha" name="senha" type="password" required autocomplete="current-password"
             placeholder="Introduza a sua senha" class="sgtf-auth-input">
      <button type="button" class="sgtf-auth-icon" data-toggle-senha="senha" aria-label="Mostrar senha">
        <span class="material-icons-sharp">visibility</span>
      </button>
    </div>

    <div class="pt-2">
      <button type="submit" class="sgtf-auth-btn" data-loading="A entrar...">
        <span class="material-icons-sharp text-[20px]">lock_open</span>
        <span data-label>Entrar no Sistema</span>
      </button>
    </div>
  </form>

  <p class="mt-6 text-center text-sm text-[#b9c6e8]">
    Estudante sem conta? <a href="{% url 'cadastro' %}" class="sgtf-auth-link">Criar conta</a>
  </p>
{% endblock %}
