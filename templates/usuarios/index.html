{% extends "layouts/autenticacao.html" %}

{% block titulo %}Entrar{% endblock %}

{% block conteudo %}
  <h1 class="text-2xl font-extrabold tracking-tight text-slate-900">Bem-vindo de volta</h1>
  <p class="mt-1.5 text-sm text-slate-500">Entre com o seu e-mail e senha.</p>

  <div class="mt-6">{% include "partials/_mensagens.html" %}</div>

  <form method="post" class="space-y-5" autocomplete="on" data-lock novalidate>
    {% csrf_token %}
    <input type="hidden" name="next" value="{{ next }}">

    <div>
      <label for="email" class="sgtf-label">E-mail</label>
      <div class="relative">
        <span class="material-icons-sharp pointer-events-none absolute left-3 top-1/2 -translate-y-1/2 text-slate-400">mail</span>
        <input id="email" name="username" type="email" required autofocus autocomplete="username"
               value="{{ request.POST.username|default:'' }}" placeholder="nome@ispb.ao" class="sgtf-input pl-10">
      </div>
    </div>

    <div>
      <label for="senha" class="sgtf-label">Senha</label>
      <div class="relative">
        <span class="material-icons-sharp pointer-events-none absolute left-3 top-1/2 -translate-y-1/2 text-slate-400">lock</span>
        <input id="senha" name="senha" type="password" required autocomplete="current-password" class="sgtf-input px-10">
        <button type="button" data-toggle-senha="senha" aria-label="Mostrar senha"
                class="absolute right-2 top-1/2 -translate-y-1/2 rounded-md p-1.5 text-slate-400 hover:text-primary">
          <span class="material-icons-sharp">visibility</span>
        </button>
      </div>
    </div>

    <button type="submit" class="sgtf-btn sgtf-btn--primary w-full py-3 text-[15px]" data-loading="A entrar...">
      <span data-label>Entrar</span>
      <span class="material-icons-sharp text-[18px]">arrow_forward</span>
    </button>
  </form>

  <p class="mt-8 text-center text-sm text-slate-500">
    Estudante sem conta?
    <a href="{% url 'cadastro' %}" class="font-semibold text-primary hover:underline">Criar conta</a>
  </p>
{% endblock %}
