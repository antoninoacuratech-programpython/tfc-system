<div class="flex items-center gap-3">
  <div class="h-2.5 flex-1 overflow-hidden rounded-full bg-slate-100" role="progressbar" aria-valuenow="{{ info.percentagem }}" aria-valuemin="0" aria-valuemax="100">
    <div class="h-full rounded-full {% if info.estado == 'parado' %}bg-red-500{% elif info.estado == 'atrasado' %}bg-amber-500{% elif info.estado == 'concluido' %}bg-primary{% else %}bg-green-500{% endif %}" style="width: {{ info.percentagem }}%"></div>
  </div>
  <span class="w-24 shrink-0 text-right text-xs font-semibold text-slate-600">{{ info.aprovadas }}/{{ info.total }} · {{ info.percentagem }}%</span>
</div>
