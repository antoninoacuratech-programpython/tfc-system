<div class="grid grid-cols-2 gap-3 sm:grid-cols-4">
  <div class="sgtf-card p-4"><p class="text-xs font-semibold text-slate-500">Trabalhos</p><p class="mt-1 text-2xl font-extrabold text-slate-900">{{ contagem.total }}</p></div>
  <div class="sgtf-card p-4"><p class="text-xs font-semibold text-green-700">Em dia / concluídos</p><p class="mt-1 text-2xl font-extrabold text-green-700">{{ contagem.em_dia|add:contagem.concluido }}</p></div>
  <div class="sgtf-card p-4"><p class="text-xs font-semibold text-amber-700">Com atrasos</p><p class="mt-1 text-2xl font-extrabold text-amber-700">{{ contagem.atrasado }}</p></div>
  <div class="sgtf-card p-4"><p class="text-xs font-semibold text-red-700">Parados (30+ dias)</p><p class="mt-1 text-2xl font-extrabold text-red-700">{{ contagem.parado }}</p></div>
</div>
