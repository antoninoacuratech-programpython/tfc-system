<div class="space-y-3" data-rubrica>
  {% if tem_rubrica %}
    <div class="flex flex-wrap items-center gap-4 rounded-xl border border-slate-200 bg-slate-50 p-3">
      <img src="{% url 'minha_rubrica' %}" alt="A sua rubrica" class="h-14 max-w-[220px] object-contain">
      <div class="text-sm text-slate-600">
        <p class="font-semibold text-slate-800">A sua rubrica guardada</p>
        <button type="button" class="font-semibold text-primary hover:underline" data-rubrica-trocar>Desenhar outra</button>
      </div>
    </div>
  {% endif %}

  <div class="space-y-2 {% if tem_rubrica %}hidden{% endif %}" data-rubrica-editor>
    <div class="flex items-center justify-between">
      <label class="sgtf-label !mb-0">Rubrica</label>
      <button type="button" class="text-xs font-semibold text-slate-500 hover:text-red-600" data-rubrica-limpar>Limpar</button>
    </div>
    <canvas class="h-40 w-full touch-none rounded-xl border-2 border-dashed border-slate-300 bg-white" data-rubrica-canvas aria-label="Área para desenhar a rubrica"></canvas>
    <p class="text-xs text-slate-400">Assine com o dedo, a caneta ou o rato. Ou carregue uma imagem (fundo branco):</p>
    <input type="file" name="rubrica_ficheiro" accept="image/png,image/jpeg" class="block w-full text-sm text-slate-500 file:mr-3 file:rounded-lg file:border-0 file:bg-primary-50 file:px-3 file:py-2 file:text-primary">
    <input type="hidden" name="rubrica_desenho" data-rubrica-dados>
  </div>
</div>
<script>
(function () {
  document.querySelectorAll("[data-rubrica]").forEach(function (bloco) {
    if (bloco.dataset.pronto) return;
    bloco.dataset.pronto = "1";
    var canvas = bloco.querySelector("[data-rubrica-canvas]");
    var dados = bloco.querySelector("[data-rubrica-dados]");
    var editor = bloco.querySelector("[data-rubrica-editor]");
    var ctx = canvas.getContext("2d");
    var desenhou = false, ativo = false, ultimo = null;

    function preparar() {
      var r = canvas.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
      canvas.width = Math.max(1, r.width * dpr);
      canvas.height = Math.max(1, r.height * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.lineWidth = 2.4; ctx.lineCap = "round"; ctx.lineJoin = "round"; ctx.strokeStyle = "#14235a";
      desenhou = false; dados.value = "";
    }
    function ponto(e) { var r = canvas.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; }

    canvas.addEventListener("pointerdown", function (e) {
      // o canvas pode ter nascido escondido (details fechado): acerta o tamanho no primeiro toque
      if (!desenhou && Math.abs(canvas.width - canvas.getBoundingClientRect().width * (window.devicePixelRatio || 1)) > 2) preparar();
      ativo = true; ultimo = ponto(e); canvas.setPointerCapture(e.pointerId); });
    canvas.addEventListener("pointermove", function (e) {
      if (!ativo) return;
      var p = ponto(e);
      ctx.beginPath(); ctx.moveTo(ultimo.x, ultimo.y); ctx.lineTo(p.x, p.y); ctx.stroke();
      ultimo = p; desenhou = true;
    });
    ["pointerup", "pointercancel", "pointerleave"].forEach(function (ev) {
      canvas.addEventListener(ev, function () {
        if (ativo && desenhou) dados.value = canvas.toDataURL("image/png");
        ativo = false;
      });
    });
    bloco.querySelector("[data-rubrica-limpar]").addEventListener("click", function () { ctx.clearRect(0, 0, canvas.width, canvas.height); preparar(); });
    var trocar = bloco.querySelector("[data-rubrica-trocar]");
    if (trocar) trocar.addEventListener("click", function () { editor.classList.remove("hidden"); preparar(); });
    if (!editor.classList.contains("hidden")) preparar();
  });
})();
</script>
