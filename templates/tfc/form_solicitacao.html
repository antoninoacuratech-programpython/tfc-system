{% extends "admin/base.html" %}

{% block content %}
<div class="max-w-4xl mx-auto py-8 px-4">
    <div class="bg-white rounded-t-2xl border-x border-t p-6 text-center">
        <h1 class="text-xl font-bold text-gray-800 uppercase">Instituto Superior Politécnico do Bié</h1>
        <h2 class="text-sm font-semibold text-gray-600 uppercase mt-1">Coordenação de {{ request.user.curso.nome }}</h2>
        <div class="mt-4 py-2 bg-blue-50 rounded-lg border border-blue-100">
            <h3 class="text-md font-bold text-blue-700 uppercase">Nova Solicitação de Defesa Pública</h3>
        </div>
    </div>

    <form method="POST" class="bg-white shadow-lg rounded-b-2xl border p-6 md:p-10 space-y-8">
        {% csrf_token %}

        <div class="space-y-4">
            <div class="space-y-2">
                <label for="predefesa_id" class="block text-sm font-bold text-gray-700 uppercase">Selecionar Estudante Aptos (Com Pré-defesa)</label>
                <select name="predefesa_id" id="predefesa_id" required 
                    class="w-full rounded-xl border-gray-200 bg-gray-50 focus:ring-primary focus:border-primary transition p-3">
                    <option value="">-- Escolha um estudante --</option>
                    {% for p in predefesas %}
                        <option value="{{ p.id }}">
                            {{ p.estudante.nome }} {{ p.estudante.sobrenome }} - Tema: {{ p.tema.titulo|truncatechars:50 }}
                        </option>
                    {% empty %}
                        <option value="" disabled>Nenhum estudante disponível para defesa neste curso.</option>
                    {% endfor %}
                </select>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div class="space-y-2">
                    <label for="data_defesa" class="block text-sm font-bold text-gray-700 uppercase">Data da Defesa Pública</label>
                    <input type="date" name="data_defesa" id="data_defesa" required 
                        class="w-full rounded-xl border-gray-200 bg-gray-50 focus:ring-primary focus:border-primary transition p-3">
                </div>

                <div class="space-y-2">
                    <label for="hora_defesa" class="block text-sm font-bold text-gray-700 uppercase">Horário</label>
                    <input type="time" name="hora_defesa" id="hora_defesa" required 
                        class="w-full rounded-xl border-gray-200 bg-gray-50 focus:ring-primary focus:border-primary transition p-3">
                </div>
            </div>

            <div class="space-y-2">
                <label for="local_defesa" class="block text-sm font-bold text-gray-700 uppercase">Local da Defesa</label>
                <input type="text" name="local_defesa" id="local_defesa" 
                    placeholder="Ex: Sala de Conferências, Auditório A, etc."
                    class="w-full rounded-xl border-gray-200 bg-gray-50 focus:ring-primary focus:border-primary transition p-3"
                    value="Instalações do ISP-BIÉ">
            </div>
        </div>

        <div class="flex flex-col md:flex-row gap-4 pt-6">
            <button type="submit" 
                class="flex-1 bg-primary hover:bg-blue-700 text-white font-bold py-4 rounded-2xl shadow-lg transition duration-300 flex items-center justify-center gap-2">
                <span class="material-icons-sharp">check_circle</span>
                Criar Solicitação Formal
            </button>
            <a href="{% url 'lista_solicitacoes' %}" 
                class="flex-1 bg-gray-100 hover:bg-gray-200 text-gray-600 font-bold py-4 rounded-2xl text-center transition duration-300 flex items-center justify-center">
                Cancelar
            </a>
        </div>
    </form>
</div>
{% endblock %}
