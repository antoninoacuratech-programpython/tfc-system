{% load static %}<!DOCTYPE html>
<html lang="pt">
<head>
  {% include "partials/_head.html" %}
  <meta name="theme-color" content="#0b1533">
  <title>{% block titulo %}Entrar{% endblock %} · {{ SISTEMA_NOME }} {{ INSTITUICAO_SIGLA }}</title>
</head>
<body class="font-sans antialiased">
  <div class="sgtf-auth-shell">
  <aside class="sgtf-auth-hero" aria-hidden="true">
    <img src="{% static 'imgs/login-foto.jpg' %}" alt="">
  </aside>

  <main class="sgtf-auth">
    <div class="sgtf-auth__panel">
      <div class="sgtf-auth__brand">
        <img src="{% static 'imgs/icons/finalispbie.jpg' %}" alt="{{ SISTEMA_NOME }} · {{ INSTITUICAO_SIGLA }}" class="sgtf-auth__logo">
        <p class="sgtf-auth__tagline mt-5">{{ SISTEMA_DESCRICAO }}</p>
      </div>

      {% block conteudo %}{% endblock %}

      <p class="sgtf-auth__footer">© {% now "Y" %} {{ INSTITUICAO_NOME }}</p>
    </div>
  </main>
  </div>

  <script>
    document.querySelectorAll("[data-toggle-senha]").forEach((btn) => {
      btn.addEventListener("click", () => {
        const campo = document.getElementById(btn.dataset.toggleSenha);
        const visivel = campo.type === "text";
        campo.type = visivel ? "password" : "text";
        btn.querySelector(".material-icons-sharp").textContent = visivel ? "visibility" : "visibility_off";
        btn.setAttribute("aria-label", visivel ? "Mostrar senha" : "Ocultar senha");
      });
    });
    document.querySelectorAll("[data-alert-close]").forEach((b) => b.addEventListener("click", () => b.closest("[data-alert]").remove()));
    document.querySelectorAll("form[data-lock]").forEach((f) => f.addEventListener("submit", () => {
      const btn = f.querySelector('[type="submit"]');
      setTimeout(() => { btn.disabled = true; btn.querySelector("[data-label]").textContent = btn.dataset.loading || "Aguarde..."; }, 0);
    }));
  </script>
  {% block extra_js %}{% endblock %}
</body>
</html>
